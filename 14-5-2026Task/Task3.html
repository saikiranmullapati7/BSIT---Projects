<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        background: #f0f0f0;
        color: #222;
      }

      #header {
        background: #3c3489;
        color: #fff;
        text-align: center;
        padding: 2.5rem 1.5rem;
      }

      #header h1 {
        font-size: 26px;
        font-weight: 600;
      }
      #header p {
        font-size: 14px;
        margin-top: 6px;
        opacity: 0.8;
      }

      #about {
        background: #fff;
        max-width: 600px;
        margin: 2rem auto;
        border-radius: 10px;
        padding: 1.5rem;
        border: 1px solid #ddd;
      }

      #about h2 {
        font-size: 18px;
        color: #0f6e56;
        margin-bottom: 8px;
      }
      #about p {
        font-size: 14px;
        line-height: 1.7;
        color: #444;
      }

      #contact {
        background: #fff;
        max-width: 600px;
        margin: 0 auto 2rem;
        border-radius: 10px;
        padding: 1.5rem;
        border: 1px solid #ddd;
      }

      #contact h2 {
        font-size: 18px;
        color: #993c1d;
        margin-bottom: 12px;
      }

      #contact ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #contact ul li {
        font-size: 14px;
        color: #444;
      }

      #contact ul li span {
        font-weight: 600;
        color: #222;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <h1>My Website</h1>
      <p>Welcome! Styled with ID selectors.</p>
    </div>

    <div id="about">
      <h2>About</h2>
      <p>
        Hi! I'm a web developer who loves building clean, simple pages. This
        section is styled using the <code>#about</code> ID selector.
      </p>
    </div>

    <div id="contact">
      <h2>Contact</h2>
      <ul>
        <li><span>Email:</span> sai@gmail.com</li>
        <li><span>Phone:</span> +91 8919715512</li>
        <li><span>Location:</span> Hyderabad, Telangana</li>
      </ul>
    </div>
  </body>
</html>
