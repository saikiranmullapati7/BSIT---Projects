<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element Selector</title>
    <style>
      p {
        color: blue;
        font-size: 18px;
        font-family: Arial;
      }

      h1 {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>This heading is Red</h1>
    <p>This paragraph is Blue.</p>
    <p>This paragraph is also Blue.</p>
  </body>
</html>
