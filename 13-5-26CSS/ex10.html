<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
  <title>Group Selector</title>
  <style>
    h1, h2, h3 {
      color: darkblue;
      font-family: Georgia, serif;
    }

    p, li {
      color: #444;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Heading 1 — Dark Blue</h1>
  <h2>Heading 2 — Dark Blue</h2>
  <h3>Heading 3 — Dark Blue</h3>

  <p>This paragraph shares style with list items.</p>

  <ul>
    <li>List item one</li>
    <li>List item two</li>
  </ul>

</body>
</html>
