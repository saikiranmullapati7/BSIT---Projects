<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ID Selector</title>
    <style>
      #main-title {
        color: green;
        font-size: 30px;
        text-align: center;
      }

      #intro {
        color: purple;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1 id="main-title">Welcome to My Page</h1>
    <p id="intro">This paragraph has a unique ID called intro.</p>
    <p>This normal paragraph has no ID — not styled.</p>
  </body>
</html>
