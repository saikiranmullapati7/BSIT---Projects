<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 2 - Navbar</title>
  <style>
    .navbar {
      background-color: #222;
      padding: 10px 20px;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      display: inline-block;
      font-size: 16px;
      font-family: Verdana, sans-serif;
    }
    .navbar a:hover {
      background-color: #ff6600;
      border-radius: 6px;
    }
    .navbar .active {
      background-color: #ff6600;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="#" class="active">Home</a>
    <a href="#">About</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
  </div>
</body>
</html>
