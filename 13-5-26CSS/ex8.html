<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Selector</title>
    <style>
      .highlight {
        background-color: yellow;
        font-weight: bold;
        padding: 5px;
      }

      .note {
        color: gray;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <p class="highlight">This is highlighted text.</p>
    <p class="note">This is a note — gray and italic.</p>
    <p class="highlight">This is also highlighted.</p>
    <p>This paragraph has no class — not styled.</p>
  </body>
</html>
