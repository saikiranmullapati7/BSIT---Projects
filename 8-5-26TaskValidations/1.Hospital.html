<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="form-container">
      <h1>Hospital Appointment Form</h1>
      <form onsubmit="return validateForm();">
        <div class="form-row">
          <label for="fullname">Patient Name:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input
            type="text"
            id="patientname"
            name="patientname"
            title="Patient Name"
            placeholder="Full name"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="dob">Patient ID:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;<input
            type="text"
            id="patientid"
            name="PatientID"
            title="patientid"
            placeholder="e.g.PAT-00123"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="age">Age :</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;
          <input type="number" placeholder="Years" min="0" max="120" />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="age">Gender :</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <input type="radio" name="gender" id="male" />Male
          <input type="radio" name="gender" id="female" />Female
          <input type="radio" name="gender" id="other" />Other
        </div>
        <br /><br />

        <div class="form-row">
          <label for="phone">Phone Number:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input
            type="tel"
            id="phone"
            name="phone"
            title="Phone Number"
            placeholder="+91 00000 00000"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="email">Email:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input
            type="email"
            id="email"
            name="email"
            title="Email Address"
            placeholder="e.g. you@gmail.com"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div>
          <label for="">Doctor name :</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<select>
            <option value="" disabled selected>Select doctor</option>
            <option>Dr.Anil Sharma --- Cardiology</option>
            <option>Dr.Priya Reddy --- Neurology</option>
            <option>Dr.Ramesh Kumar --- Orthopedics</option>
            <option>Dr.Sneha Patel --- Dermatology</option>
            <option>Dr.Vikram Nair --- General Medicine</option>
          </select>
        </div>
        <br /><br />

        <div class="form-row">
          <label for="dob">Date of Birth:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <input type="date" id="dob" name="dob" title="Date of Birth" />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="dob">Appointment time :</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <input type="time" name="time" min="09:00" max="17:00" />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="remarks">Symptoms / reason for visit :</label>
          &nbsp;&nbsp;&nbsp;<textarea
            id="remarks"
            name="remarks"
            title="Remarks"
            placeholder="Any additional info (min 2, max 100 characters)"
            rows="3"
            style="width: 300px"
          ></textarea>
        </div>
        <br /><br />

        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button type="submit">
          Confirm appointment
        </button>
      </form>
    </div>
    <div id="errorBox" style="color: red; margin-bottom: 15px">
      <script>
        function validateForm() {
          let errors = [];

          let patientnamepatt = document
            .getElementById("patientname")
            .value.trim();
          let patientidpatt = document.getElementById("patientid").value.trim();
          let agepatt = document.getElementById("age").value.trim();
          let phonenumberpatt = document.getElementById("phone").value.trim();
          let emailpatt = document.getElementById("email").value.trim();
          let doctorpatt = document.getElementById("doctor").value;
          let dobpatt = document.getElementById("dob").value;
          let appttimepatt = document.getElementById("appttime").value;
          let symp_reaspatt = document.getElementById("remarks").value.trim();

          let patientnamepattern = /^[A-Za-z]+( [A-Za-z]+)*$/;
          if (!patientnamepatt) {
            errors.push("Patient Name is required.");
          } else if (!patientnamepattern.test(patientnamepatt)) {
            errors.push("Name should contain only alphabets.");
          }

          let patientidpattern = /^[A-Z]{3}-[0-9]{5}$/;
          if (!patientidpatt) {
            errors.push("Patient ID is required.");
          } else if (!patientidpattern.test(patientidpatt)) {
            errors.push("Patient ID must be in format PAT-00123.");
          }

          if (!agepatt) {
            errors.push("Age is required.");
          } else {
            let age = parseInt(agepatt);
            if (isNaN(age) || age < 0 || age > 120) {
              errors.push("Age must be between 0 and 120.");
            }
          }

          if (!document.querySelector('input[name="gender"]:checked')) {
            errors.push("Please select a gender.");
          }

          let phonenumberpattern = /^[6-9][0-9]{9}$/;
          if (!phonenumberpatt) {
            errors.push("Phone number is required.");
          } else if (!phonenumberpattern.test(phonenumberpatt)) {
            errors.push(
              "Mobile number must be 10 digits and start with 6, 7, 8 or 9.",
            );
          }

          let emailpattern =
            /^[a-zA-Z][a-zA-Z0-9._%+-]*@[a-zA-Z0-9.-]+\.(com|in|co)$/;
          if (!emailpatt) {
            errors.push("Email is required.");
          } else if (!emailpattern.test(emailpatt)) {
            errors.push("Enter a valid email.");
          }

          if (!doctorpatt) {
            errors.push("Please select a doctor.");
          }

          if (!dobpatt) {
            errors.push("Date of Birth is required.");
          } else {
            let dobDate = new Date(dobpatt);
            let today = new Date();
            today.setHours(0, 0, 0, 0);
            if (dobDate >= today) {
              errors.push("Date of Birth must be a past date.");
            }
          }

          if (!appttimepatt) {
            errors.push("Appointment time is required.");
          } else {
            let [h, m] = appttimepatt.split(":").map(Number);
            let totalMins = h * 60 + m;
            if (totalMins < 9 * 60 || totalMins > 17 * 60) {
              errors.push(
                "Appointment time must be between 09:00 AM and 05:00 PM.",
              );
            }
          }

          let Symptoms_reason_pattern = /^[A-Za-z0-9 .,]{10,100}$/;
          if (!symp_reaspatt) {
            errors.push("Symptoms / Reason for visit is required.");
          } else if (symp_reaspatt.length < 10 || symp_reaspatt.length > 100) {
            errors.push("Symptoms must be between 10 and 100 characters.");
          } else if (!Symptoms_reason_pattern.test(symp_reaspatt)) {
            errors.push(
              "Symptoms can contain only letters, numbers, spaces, commas and periods.",
            );
          }

          let errorBox = document.getElementById("errorBox");
          if (errors.length > 0) {
            errorBox.innerHTML = errors
              .map((err) => "<p>" + err + "</p>")
              .join("");
            return false;
          } else {
            errorBox.innerHTML =
              "<p style='color:green;'>Patient form submitted successfully! ✅</p>";
            return false;
          }
        }
      </script>
    </div>
  </body>
</html>
