<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="form-container">
      <h1>Social Media Registration Form</h1>
      <form onsubmit="return validateForm();">
        <div class="form-row">
          <label for="fullname">Full Name:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input
            type="text"
            id="fullname"
            name="yourfullname"
            title="Full Name"
            placeholder="Your Full name"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="fullname">Username :</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input
            type="text"
            id="username"
            name="username"
            title="Full Name"
            placeholder="@yourhandle"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="email">Email:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;<input
            type="email"
            id="email"
            name="email"
            title="Email Address"
            placeholder="e.g. you@gmail.com"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="phone">Mobile Number:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<input
            type="tel"
            id="phone"
            name="mobile"
            title="Mobile Number"
            placeholder="+91 00000 00000"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="dob">Date of Birth:</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp;<input
            type="date"
            id="dob"
            name="dob"
            title="Date of Birth"
          />
        </div>
        <br /><br />

        <div class="form-row">
          <label for="age">Gender :</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input
            type="radio"
            name="gender"
            id="male"
          />Male <input type="radio" name="gender" id="female" />Female
          <input type="radio" name="gender" id="other" />Other
        </div>
        <br /><br />

        <div>
          <label>Portfolio bio :</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <textarea name="bio" id="bio" style="width: 300px"></textarea>
        </div>
        <br /><br />

        <div>
          <label>Password :</label>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input
            type="password"
            name="pwd"
            id="pwd"
            placeholder="Create a password"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <div>
          <label>Confirm Password :</label>
          &nbsp;&nbsp;<input
            type="password"
            name="cpwd"
            id="cpwd"
            placeholder="Re-enter password"
            style="width: 300px"
          />
        </div>
        <br /><br />

        <label class="terms-box">
          <input type="checkbox" id="terms" />
          <span class="terms-text">
            I agree to the <a href="#">Accept Terms & Conditions</a> and
            <a href="#">Privacy Policy</a>.
          </span> </label
        ><br /><br />

        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button type="submit">
          submit
        </button>
      </form>
    </div>
    <script>
      function validateForm() {
        let fullname = document.getElementById("fullname").value.trim();
        let username = document.getElementById("username").value.trim();
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let dob = document.getElementById("dob").value;
        let bio = document.getElementById("bio").value.trim();
        let pwd = document.getElementById("pwd").value;
        let cpwd = document.getElementById("cpwd").value;
        let gender = document.querySelector('input[name="gender"]:checked');
        let terms = document.getElementById("terms").checked;

        //Fullname
        let namepattern = /^[A-Za-z]+( [A-Za-z]+)*$/;
        if (!namepattern.test(fullname)) {
          alert("Full Name: Only alphabets and spaces allowed");
          return false;
        }

        //username
        let usernamepattern = /^@[a-zA-Z0-9._]{3,20}$/;
        if (!usernamepattern.test(username)) {
          alert(
            "Username: Must start with @ and be 3-20 characters (e.g. @sai_m)",
          );
          return false;
        }

        // email
        let emailpattern =
          /^[a-zA-Z][a-zA-Z0-9._%+-]*@[a-zA-Z0-9.-]+\.(com|in|co)$/;
        if (!emailpattern.test(email)) {
          alert("Email: Enter a valid email (e.g. you@gmail.com|com|in|co)");
          return false;
        }

        //Mobile number
        let phonepattern = /^[6-9][0-9]{9}$/;
        if (!phonepattern.test(phone)) {
          alert("Mobile Number: Must be 10 digits starting with 6, 7, 8 or 9");
          return false;
        }

        //Date of birth
        let dobDate = new Date(dob);
        let today = new Date();
        let age = today.getFullYear() - dobDate.getFullYear();
        let monthDiff = today.getMonth() - dobDate.getMonth();
        if (
          monthDiff < 0 ||
          (monthDiff === 0 && today.getDate() < dobDate.getDate())
        ) {
          age--;
        }
        if (age < 16) {
          alert("You must be at least 18 years old to apply!");
          return false;
        }
        //bio
        if (bio.length < 10) {
          alert("Portfolio Bio: Please enter at least 10 characters");
          return false;
        }
        //Password
        let pwdpattern = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$/;
        if (!pwdpattern.test(pwd)) {
          alert(
            "Password must be at least 8 characters with 1 uppercase, 1 number, and 1 special character (!@#$%^&*)",
          );
          return false;
        }
        // Confirm password
        if (pwd != cpwd) {
          alert("Confirm Password: Passwords do not match!");
          return false;
        }

        //terms
        if (!terms) {
          alert("Please agree to the Terms of Service and Privacy Policy");
          return false;
        }

        alert("Registration Successful! ✅");
        return false;
      }
    </script>
  </body>
</html>
