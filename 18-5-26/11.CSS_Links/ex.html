<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      a:link {
        color: #04aa6d;
        text-decoration: none;
      }

      a:visited {
        color: gray;
      }

      a:hover {
        color: #028a4e;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h2>Styled Links</h2>
    <p><a href="https://www.w3schools.com">W3Schools</a></p>
    <p><a href="https://www.w3schools.com/css">CSS Tutorial</a></p>
  </body>
</html>
